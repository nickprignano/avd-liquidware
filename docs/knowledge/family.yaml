# The knowledge base family: sibling KBs that share this KB's format and know about each other.
# Schema: schema/family.schema.json, the same in every KB. How it works:
# curation.md#staying-aligned-with-the-family. Add a sibling's repo once it's known, then add
# its two sources in sources.toml.

format_version: 1
projects:
- id: liquidware
  name: Liquidware
  self: true
  repo: nickprignano/avd-liquidware
  kb_path: docs/knowledge
  role: member
  focus: Liquidware products on virtual desktops, starting with Stratusphere UX in Azure
  owns: [Liquidware products, Stratusphere UX appliances, the Connector ID Key, the Stratusphere API,
    this repo's Bicep and PowerShell]
  format_version: 1
- id: ai
  name: AI
  repo: nickprignano/ai-brain
  kb_path: docs/knowledge
  role: hub
  focus: The AI research behind all four projects
  owns: [Claude API and Microsoft Foundry use, model choices, keyless sign-in for AI APIs, prompts and evaluations,
    AI tooling shared by the family]
  format_version: 1
- id: nerdio-hcl
  name: Nerdio HCL kit
  repo: nickprignano/nerdio-hcl
  kb_path: docs/knowledge
  role: reference
  focus: Nerdio Manager on Azure Virtual Desktop, deployed with Terraform and Packer
  owns: [Nerdio Manager, the nerdio/nme provider, this kit's Terraform and Packer]
  format_version: 1
- id: avd
  name: AVD
  # Its knowledge base predates the family format (JSON under knowledge/, decisions under
  # docs/decisions), so it has no format_version yet and the freshness check flags it.
  repo: nickprignano/avd-second-brain
  kb_path: knowledge
  role: member
  focus: Azure Virtual Desktop itself
  owns: [Azure Virtual Desktop platform, FSLogix, session host images in general]
