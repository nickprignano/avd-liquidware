name: kb-feedback

# Closes the loop from people using the KB back into it. When a maintainer labels a
# "Knowledge base feedback", "Known error" or "Suggest an expert" issue kb-accepted, this turns the
# issue form into a change to the KB's YAML data (field-reports.yaml,
# troubleshooting/known-errors.yaml or experts.yaml),
# validates it, and opens a pull request for review. The label is the review gate: issue text is
# untrusted, is only parsed as data, and nothing merges without a reviewed PR.
#
# Opening the PR needs "Allow GitHub Actions to create and approve pull requests" (Settings >
# Actions > General, set once by hand; see curation.md). Without it the branch is still pushed and the
# issue gets a link to open the PR.
# PRs opened with GITHUB_TOKEN don't trigger other workflows; this job runs the same checks
# before pushing, and a maintainer can close and reopen the PR to run the full CI.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: kb-feedback-${{ github.event.issue.number }}

jobs:
  # Decision 0008: skip when a family directive pauses this workflow, or KB_PAUSED is set here.
  gate:
    if: >-
      github.event.label.name == 'kb-accepted' &&
      (contains(github.event.issue.labels.*.name, 'kb-feedback') ||
       contains(github.event.issue.labels.*.name, 'kb-known-error') ||
       contains(github.event.issue.labels.*.name, 'kb-source'))
    runs-on: ubuntu-latest
    outputs:
      paused: ${{ steps.gate.outputs.paused }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/kb/requirements.txt
      - id: gate
        env:
          KB_PAUSED: ${{ vars.KB_PAUSED }}
        run: python3 scripts/kb/directives.py gate kb-feedback

  propose:
    needs: gate
    if: needs.gate.outputs.paused != 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/kb/requirements.txt
      - name: Turn the issue into a KB change
        id: change
        run: python3 scripts/kb/feedback.py --event "$GITHUB_EVENT_PATH" --body-file "$RUNNER_TEMP/pr-body.md"
      - name: Regenerate and validate
        run: |
          python3 scripts/kb/build.py
          python3 scripts/kb/validate.py
      - name: Push branch and open PR
        env:
          BRANCH: ${{ steps.change.outputs.branch }}
          TITLE: ${{ steps.change.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add docs/knowledge llms.txt
          git commit -m "$TITLE"
          git push --force-with-lease origin "$BRANCH"
          if url=$(gh pr create --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"); then
            gh issue comment "$ISSUE" --body "Opened $url for review."
          else
            gh issue comment "$ISSUE" --body "Pushed branch \`$BRANCH\`. Actions can't open PRs in this repo, so open one from that branch."
          fi
      - name: Report a rejected issue
        if: failure()
        run: |
          reason="$(cat feedback-error.txt 2>/dev/null || echo 'the change failed validation; see the workflow run')"
          gh issue comment "$ISSUE" --body "Couldn't turn this into a KB change: ${reason}. Edit the issue, then remove and re-add the kb-accepted label. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
