name: kb-validate

# Checks the knowledge base on every change to it: front matter and YAML against the JSON Schemas,
# MADR decision records, links and anchors, leak patterns, generated files (indexes, tables,
# llms.txt) in sync, the family checks, and the KB scripts' unit tests. Secrets are covered by gitleaks
# in secrets.yml.

on:
  pull_request:
    paths:
      - docs/knowledge/**
      - scripts/kb/**
      - llms.txt
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/kb-*.yml
      - docs/2ndbrain/**
      - docs/guardrails.md
      - .claude/skills/**
      - skills/**
      - template/**
      - AGENTS.md
  push:
    branches: [main]
    paths:
      - docs/knowledge/**
      - scripts/kb/**
      - llms.txt

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/kb/requirements.txt
      - name: Directives are owner-only (decision 0008)
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != github.repository_owner
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' \
              | grep -qx 'docs/knowledge/directives.yaml'; then
            echo "::error file=docs/knowledge/directives.yaml::Only the repo owner may change directives.yaml"
            exit 1
          fi
      - name: Schema, links and leak patterns
        run: python3 scripts/kb/validate.py
      - name: Generated files in sync
        run: python3 scripts/kb/build.py --check
      - name: Unit tests
        run: python3 -m unittest discover -s scripts/kb -v
